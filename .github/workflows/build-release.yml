name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.7.3
  AQT_VERSION: 3.3.0
  FLATPAK_RUNTIME_VERSION: '25.08'
  MPV_WINBUILD_REPOSITORY: zhongfly/mpv-winbuild
  MPV_WINBUILD_ASSET_PATTERN: '^mpv-dev-x86_64-[0-9]{8}-git-[0-9a-fA-F]+\.7z$'

jobs:
  metadata:
    name: Resolve package metadata
    runs-on: ubuntu-24.04
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      installer-version: ${{ steps.version.outputs.installer-version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}

    steps:
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(stable|alpha|beta)(\.[0-9]+)?)(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
            if [[ "$GITHUB_REF_NAME" == v* && "$tag_version" =~ $semver_pattern ]]; then
              installer_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              prerelease="${BASH_REMATCH[4]}${BASH_REMATCH[5]}"
            else
              echo "Tag must use v-prefixed Semantic Versioning: $GITHUB_REF_NAME"
              exit 1
            fi

            if [[ -n "$prerelease" ]]; then
              if [[ "$prerelease" == stable.* ]]; then
                echo "Stable tags cannot have a numeric suffix: $GITHUB_REF_NAME"
                exit 1
              fi
              IFS='.' read -ra prerelease_identifiers <<< "$prerelease"
              for identifier in "${prerelease_identifiers[@]}"; do
                if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                  echo "Numeric prerelease identifiers cannot have leading zeros: $identifier"
                  exit 1
                fi
              done
              if [[ "$prerelease" == stable ]]; then
                is_prerelease=false
              else
                is_prerelease=true
              fi
            else
              is_prerelease=false
            fi
            package_version="$tag_version"
          else
            package_version="${GITHUB_SHA::7}"
            installer_version=""
            is_prerelease=false
          fi
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "installer-version=$installer_version" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package-suffix }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
      INSTALLER_VERSION: ${{ needs.metadata.outputs.installer-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-suffix: windows-x86_64
            os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2019_64
            qt-dir: msvc2019_64
          - package-suffix: macos-x86_64
            os: macos-15-intel
            qt-host: mac
            qt-arch: clang_64
            qt-dir: macos
            cmake-osx-arch: x86_64
          - package-suffix: macos-arm64
            os: macos-15
            qt-host: mac
            qt-arch: clang_64
            qt-dir: macos
            cmake-osx-arch: arm64
          - package-suffix: linux-x86_64
            os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            qt-dir: gcc_64
          - package-suffix: linux-arm64
            os: ubuntu-24.04-arm
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
            qt-dir: gcc_arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install aqtinstall
        run: python -m pip install --upgrade pip "aqtinstall==${{ env.AQT_VERSION }}"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libmpv-dev \
            libxcb-cursor-dev \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            ninja-build \
            p7zip-full \
            patchelf \
            pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install mpv ninja openssl@3 p7zip pkg-config

      - name: Install Qt
        shell: bash
        run: |
          python -m aqt install-qt \
            "${{ matrix.qt-host }}" \
            desktop \
            "$QT_VERSION" \
            "${{ matrix.qt-arch }}" \
            -O "$RUNNER_TEMP/Qt" \
            --external 7z

      - name: Export Qt paths
        if: runner.os != 'Windows'
        shell: bash
        run: |
          qt_root="$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix.qt-dir }}"
          test -f "$qt_root/lib/cmake/Qt6/Qt6Config.cmake"
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$qt_root" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"

      - name: Export Qt paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:RUNNER_TEMP "Qt\$($env:QT_VERSION)\${{ matrix.qt-dir }}"
          if (!(Test-Path "$qtRoot\lib\cmake\Qt6\Qt6Config.cmake")) {
            throw "Qt6Config.cmake not found under $qtRoot"
          }
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qtRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Export Homebrew pkg-config path
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install Windows libmpv development package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apiHeaders = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "Cache-Control" = "no-cache"
            "User-Agent" = "vibePlayerQT-GitHub-Actions"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/$env:MPV_WINBUILD_REPOSITORY/releases/latest"
          $release = Invoke-RestMethod -Uri $releaseUri -Headers $apiHeaders
          $asset = $null
          $releaseAssets = @()
          $maxAssetAttempts = 12
          for ($attempt = 1; $attempt -le $maxAssetAttempts; $attempt++) {
            $assetsUri = "$($release.assets_url)?per_page=100"
            $releaseAssetsResponse = Invoke-RestMethod -Uri $assetsUri -Headers $apiHeaders
            $releaseAssets = @(
              foreach ($releaseAsset in $releaseAssetsResponse) {
                $releaseAsset
              }
            )
            $assets = @($releaseAssets | Where-Object { $_.name -match $env:MPV_WINBUILD_ASSET_PATTERN })
            if ($assets.Count -eq 1) {
              $asset = $assets[0]
              break
            }
            if ($assets.Count -gt 1) {
              $assetNames = @($releaseAssets | ForEach-Object { $_.name }) -join ", "
              throw "Expected exactly one x86_64 libmpv development package in release $($release.tag_name); found $($assets.Count). Assets: $assetNames"
            }
            if ($attempt -lt $maxAssetAttempts) {
              Write-Warning "Release $($release.tag_name) does not expose the standard x86_64 development package yet; retrying in 10 seconds ($attempt/$maxAssetAttempts)"
              Start-Sleep -Seconds 10
            }
          }
          if ($null -eq $asset) {
            $assetNames = @($releaseAssets | ForEach-Object { $_.name }) -join ", "
            throw "Expected exactly one x86_64 libmpv development package in release $($release.tag_name) after $maxAssetAttempts attempts; found 0. Assets: $assetNames"
          }

          $digestMatch = [regex]::Match([string]$asset.digest, '^sha256:([0-9a-fA-F]{64})$')
          if (!$digestMatch.Success) {
            throw "Release asset $($asset.name) does not provide a valid SHA-256 digest"
          }
          $expectedHash = $digestMatch.Groups[1].Value.ToLowerInvariant()
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Write-Host "Downloading $($asset.name) from release $($release.tag_name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Unexpected libmpv package hash: expected $expectedHash, got $actualHash"
          }

          New-Item -ItemType Directory -Force third_party\mpv\dev | Out-Null
          7z x $archive "-othird_party\mpv\dev" -y
          foreach ($requiredFile in @("include\mpv\client.h", "libmpv.dll.a", "libmpv-2.dll")) {
            if (!(Test-Path (Join-Path "third_party\mpv\dev" $requiredFile))) {
              throw "Extracted libmpv package is missing $requiredFile"
            }
          }

      - name: Configure CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl).Source
          $lldLink = (Get-Command lld-link).Source
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=$($env:BUILD_TYPE)",
            "-DCMAKE_PREFIX_PATH=$($env:QT_ROOT)",
            "-DCMAKE_C_COMPILER=$clang",
            "-DCMAKE_CXX_COMPILER=$clang",
            "-DCMAKE_LINKER=$lldLink"
          )
          if ($env:INSTALLER_VERSION) {
            $cmakeArgs += "-DVIBEPLAYER_PACKAGE_VERSION=$($env:PACKAGE_VERSION)"
          }
          cmake @cmakeArgs

      - name: Configure CMake on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake_args=(
            -S .
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
            -DCMAKE_PREFIX_PATH="$QT_ROOT"
          )
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=(
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake-osx-arch }}"
              -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
            )
          fi
          if [[ -n "$INSTALLER_VERSION" ]]; then
            cmake_args+=(-DVIBEPLAYER_PACKAGE_VERSION="$PACKAGE_VERSION")
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run CTest
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Install deployable bundle on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "package"
          "PACKAGE_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake --install build --config $env:BUILD_TYPE --prefix "$prefix"

      - name: Install deployable bundle on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/package"
          echo "PACKAGE_DIR=$prefix" >> "$GITHUB_ENV"
          cmake --install build --config "$BUILD_TYPE" --prefix "$prefix"

      - name: Add Linux launcher
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > "$PACKAGE_DIR/vibePlayerQT.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          app_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$app_dir/bin/vibePlayerQT" "$@"
          EOF
          sed -i 's/^          //' "$PACKAGE_DIR/vibePlayerQT.sh"
          chmod +x "$PACKAGE_DIR/vibePlayerQT.sh"

      - name: Validate Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "$env:PACKAGE_DIR\bin\vibePlayerQT.exe")) { throw "Missing vibePlayerQT.exe" }
          if (!(Test-Path "$env:PACKAGE_DIR\bin\libmpv-2.dll")) { throw "Missing libmpv-2.dll" }
          Get-ChildItem -Recurse "$env:PACKAGE_DIR" | Select-Object FullName, Length

      - name: Validate macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$PACKAGE_DIR/vibePlayerQT.app"
          test -x "$app/Contents/MacOS/vibePlayerQT"
          test -f "$app/Contents/Resources/app_icon.icns"
          plutil -extract CFBundleIconFile raw -o - "$app/Contents/Info.plist" | grep -Fx 'app_icon.icns'
          test -d "$app/Contents/Frameworks"
          while IFS= read -r -d '' file_path; do
            if file -L "$file_path" | grep -q 'Mach-O'; then
              linked_libraries="$(otool -L "$file_path")"
              echo "$linked_libraries"
              if echo "$linked_libraries" | grep -E '/opt/homebrew|/usr/local'; then
                echo "Found non-bundled Homebrew dependency in $file_path"
                exit 1
              fi
            fi
          done < <(find "$app" \( -type f -o -type l \) -print0)

      - name: Validate Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x "$PACKAGE_DIR/bin/vibePlayerQT"
          test -x "$PACKAGE_DIR/vibePlayerQT.sh"
          test -f "$PACKAGE_DIR/share/applications/vibePlayerQT.desktop"
          test -f "$PACKAGE_DIR/share/icons/hicolor/1024x1024/apps/vibePlayerQT.png"
          ldd "$PACKAGE_DIR/bin/vibePlayerQT"

      - name: Stage Windows build input
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-input | Out-Null
          Compress-Archive `
            -Path "$env:PACKAGE_DIR\*" `
            -DestinationPath "build-input\package.zip" `
            -Force
          Copy-Item build\CPackConfig.cmake build-input\CPackConfig.cmake

      - name: Stage macOS build input
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input
          ditto -c -k --sequesterRsrc --keepParent \
            "$PACKAGE_DIR/vibePlayerQT.app" \
            build-input/package.zip
          cp build/CPackConfig.cmake build-input/CPackConfig.cmake

      - name: Stage Linux build input
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input
          tar -C "$PACKAGE_DIR" -czf build-input/package.tar.gz .
          cp build/CPackConfig.cmake build-input/CPackConfig.cmake

      - name: Upload build input
        uses: actions/upload-artifact@v4
        with:
          name: build-input-${{ matrix.package-suffix }}
          path: build-input/*
          if-no-files-found: error
          retention-days: 1

  portable:
    name: Package portable ${{ matrix.package-suffix }}
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-suffix: windows-x86_64
            input-file: package.zip
            extension: zip
          - package-suffix: macos-x86_64
            input-file: package.zip
            extension: zip
          - package-suffix: macos-arm64
            input-file: package.zip
            extension: zip
          - package-suffix: linux-x86_64
            input-file: package.tar.gz
            extension: tar.gz
          - package-suffix: linux-arm64
            input-file: package.tar.gz
            extension: tar.gz

    steps:
      - name: Download build input
        uses: actions/download-artifact@v4
        with:
          name: build-input-${{ matrix.package-suffix }}
          path: build-input

      - name: Publish portable archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp \
            "build-input/${{ matrix.input-file }}" \
            "dist/vibePlayerQT-${PACKAGE_VERSION}-${{ matrix.package-suffix }}.${{ matrix.extension }}"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-portable-${{ matrix.package-suffix }}
          path: dist/*
          if-no-files-found: error

  native:
    name: Package ${{ matrix.format-label }} ${{ matrix.package-suffix }}
    needs:
      - metadata
      - build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format-label: NSIS EXE
            artifact-key: nsis
            cpack-generator: NSIS
            extension: exe
            file-suffix: -installer
            package-suffix: windows-x86_64
            os: windows-2022
          - format-label: MSI
            artifact-key: msi
            cpack-generator: WIX
            extension: msi
            file-suffix: -installer
            package-suffix: windows-x86_64
            os: windows-2022
          - format-label: DMG
            artifact-key: dmg
            cpack-generator: DragNDrop
            extension: dmg
            file-suffix: ''
            package-suffix: macos-x86_64
            os: macos-15-intel
          - format-label: DMG
            artifact-key: dmg
            cpack-generator: DragNDrop
            extension: dmg
            file-suffix: ''
            package-suffix: macos-arm64
            os: macos-15
          - format-label: DEB
            artifact-key: deb
            cpack-generator: DEB
            extension: deb
            file-suffix: ''
            package-suffix: linux-x86_64
            os: ubuntu-24.04
          - format-label: DEB
            artifact-key: deb
            cpack-generator: DEB
            extension: deb
            file-suffix: ''
            package-suffix: linux-arm64
            os: ubuntu-24.04-arm
          - format-label: RPM
            artifact-key: rpm
            cpack-generator: RPM
            extension: rpm
            file-suffix: ''
            package-suffix: linux-x86_64
            os: ubuntu-24.04
          - format-label: RPM
            artifact-key: rpm
            cpack-generator: RPM
            extension: rpm
            file-suffix: ''
            package-suffix: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Check out packaging source
        uses: actions/checkout@v4

      - name: Download build input
        uses: actions/download-artifact@v4
        with:
          name: build-input-${{ matrix.package-suffix }}
          path: build-input

      - name: Restore Windows package directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive build-input\package.zip package -Force

      - name: Restore macOS package directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          ditto -x -k build-input/package.zip package

      - name: Restore Linux package directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          tar -C package -xzf build-input/package.tar.gz

      - name: Install Linux native packaging tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          case "${{ matrix.cpack-generator }}" in
            DEB)
              sudo apt-get install -y dpkg-dev libcjson1 libmariadb3 libmysofa1
              ;;
            RPM)
              sudo apt-get install -y rpm
              ;;
            *)
              echo "Unsupported Linux native generator: ${{ matrix.cpack-generator }}"
              exit 1
              ;;
          esac

      - name: Locate Windows installer tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.cpack-generator }}" -eq "NSIS") {
            $makensis = Get-Command makensis.exe -ErrorAction Stop
            Write-Host "Using NSIS: $($makensis.Source)"
            exit 0
          }

          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (!$candle) {
            $candle = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (!$candle) {
              throw "WiX Toolset v3 candle.exe was not found"
            }
            $env:WIX = Split-Path (Split-Path $candle.FullName -Parent) -Parent
            "WIX=$($env:WIX)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          $candlePath = $candle.Source
          if (!$candlePath) {
            $candlePath = $candle.FullName
          }
          Write-Host "Using WiX: $candlePath"

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $packageDir = (Resolve-Path package).Path.Replace('\', '/')
          $workspaceDir = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $outputDir = Join-Path $env:RUNNER_TEMP "cpack-${{ matrix.artifact-key }}"
          $cpackArgs = @(
            "-G", "${{ matrix.cpack-generator }}",
            "-C", "$env:BUILD_TYPE",
            "--config", "build-input\CPackConfig.cmake",
            "-B", "$outputDir",
            "-D", "CPACK_INSTALL_CMAKE_PROJECTS=",
            "-D", "CPACK_INSTALLED_DIRECTORIES=$packageDir;.",
            "-D", "CPACK_NSIS_MUI_ICON=$workspaceDir/icon/app_icon.ico",
            "-D", "CPACK_NSIS_MUI_UNIICON=$workspaceDir/icon/app_icon.ico",
            "-D", "CPACK_WIX_PRODUCT_ICON=$workspaceDir/icon/app_icon.ico"
          )
          cpack @cpackArgs
          if ($LASTEXITCODE -ne 0) {
            throw "CPack exited with code $LASTEXITCODE"
          }

          $packages = @(Get-ChildItem -LiteralPath $outputDir -Filter "*.${{ matrix.extension }}" -File)
          if ($packages.Count -ne 1) {
            throw "Expected one ${{ matrix.extension }} package, found $($packages.Count)"
          }
          Copy-Item $packages[0].FullName `
            "dist\vibePlayerQT-$($env:PACKAGE_VERSION)-${{ matrix.package-suffix }}${{ matrix.file-suffix }}.${{ matrix.extension }}"

      - name: Package Unix native artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          package_dir="$(realpath package)"
          output_dir="$RUNNER_TEMP/cpack-${{ matrix.artifact-key }}"
          rm -rf "$output_dir"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            install_subdir="/usr"
          else
            install_subdir="."
          fi

          cpack \
            -G "${{ matrix.cpack-generator }}" \
            -C "$BUILD_TYPE" \
            --config build-input/CPackConfig.cmake \
            -B "$output_dir" \
            -D "CPACK_INSTALL_CMAKE_PROJECTS=" \
            -D "CPACK_INSTALLED_DIRECTORIES=${package_dir};${install_subdir}"

          shopt -s nullglob
          packages=("$output_dir"/*.${{ matrix.extension }})
          shopt -u nullglob
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one ${{ matrix.extension }} package, found ${#packages[@]}"
            exit 1
          fi
          output="dist/vibePlayerQT-${PACKAGE_VERSION}-${{ matrix.package-suffix }}${{ matrix.file-suffix }}.${{ matrix.extension }}"
          cp "${packages[0]}" "$output"

          case "${{ matrix.cpack-generator }}" in
            DEB)
              dpkg-deb --info "$output"
              ;;
            RPM)
              rpm -qip "$output"
              ;;
          esac

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-key }}-${{ matrix.package-suffix }}
          path: dist/*
          if-no-files-found: error

  appimage:
    name: Package AppImage ${{ matrix.package-suffix }}
    needs:
      - metadata
      - build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-suffix: linux-x86_64
            os: ubuntu-24.04
            appimage-arch: x86_64
          - package-suffix: linux-arm64
            os: ubuntu-24.04-arm
            appimage-arch: aarch64

    steps:
      - name: Check out packaging source
        uses: actions/checkout@v4

      - name: Download Linux build input
        uses: actions/download-artifact@v4
        with:
          name: build-input-${{ matrix.package-suffix }}
          path: build-input

      - name: Restore Linux package directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          tar -C package -xzf build-input/package.tar.gz

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          appdir="$RUNNER_TEMP/vibePlayerQT.AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir"
          cp -a package/. "$appdir/"

          cat > "$appdir/AppRun" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          app_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$app_dir/lib:${LD_LIBRARY_PATH:-}"
          exec "$app_dir/bin/vibePlayerQT" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          cp "$appdir/share/applications/vibePlayerQT.desktop" "$appdir/vibePlayerQT.desktop"
          sed -i 's/^Exec=.*/Exec=AppRun/' "$appdir/vibePlayerQT.desktop"
          cp "$appdir/share/icons/hicolor/1024x1024/apps/vibePlayerQT.png" "$appdir/vibePlayerQT.png"
          ln -sf vibePlayerQT.png "$appdir/.DirIcon"

          appimagetool="$RUNNER_TEMP/appimagetool-${{ matrix.appimage-arch }}.AppImage"
          curl -L --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage-arch }}.AppImage" \
            -o "$appimagetool"
          chmod +x "$appimagetool"

          output="dist/vibePlayerQT-${PACKAGE_VERSION}-${{ matrix.package-suffix }}.AppImage"
          ARCH="${{ matrix.appimage-arch }}" APPIMAGE_EXTRACT_AND_RUN=1 \
            "$appimagetool" "$appdir" "$output"
          test -s "$output"
          chmod +x "$output"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-appimage-${{ matrix.package-suffix }}
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Package Flatpak ${{ matrix.package-suffix }}
    needs:
      - metadata
      - build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-suffix: linux-x86_64
            os: ubuntu-24.04
            flatpak-arch: x86_64
          - package-suffix: linux-arm64
            os: ubuntu-24.04-arm
            flatpak-arch: aarch64

    steps:
      - name: Check out packaging source
        uses: actions/checkout@v4

      - name: Download Linux build input
        uses: actions/download-artifact@v4
        with:
          name: build-input-${{ matrix.package-suffix }}
          path: build-input

      - name: Restore Linux package directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          tar -C package -xzf build-input/package.tar.gz

      - name: Install Flatpak packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak imagemagick ostree

      - name: Install Flatpak SDK and runtime
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install \
            --user \
            --noninteractive \
            --arch="${{ matrix.flatpak-arch }}" \
            flathub \
            "org.freedesktop.Platform//$FLATPAK_RUNTIME_VERSION" \
            "org.freedesktop.Sdk//$FLATPAK_RUNTIME_VERSION"
          flatpak info \
            --user \
            --arch="${{ matrix.flatpak-arch }}" \
            org.freedesktop.Platform \
            "$FLATPAK_RUNTIME_VERSION"
          flatpak info \
            --user \
            --arch="${{ matrix.flatpak-arch }}" \
            org.freedesktop.Sdk \
            "$FLATPAK_RUNTIME_VERSION"

      - name: Package Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          output="dist/vibePlayerQT-${PACKAGE_VERSION}-${{ matrix.package-suffix }}.flatpak"
          bash packaging/flatpak/build-bundle.sh \
            package \
            "$output" \
            "${{ matrix.flatpak-arch }}"
          test -s "$output"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-${{ matrix.package-suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - portable
      - native
      - appimage
      - flatpak
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Install release inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak msitools ostree p7zip-full rpm

      - name: Guard generated source archive
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.git|\.github|AGENTS\.md|VIBEDOCS|bugFix|featDocs|docs|resources|tests|scripts|TODO\.md|local-data|fixtures|samples|cache)(/|$)'
          git archive --format=tar HEAD > source-archive-check.tar
          tar -tf source-archive-check.tar > source-archive-contents.txt
          if grep -E "$forbidden" source-archive-contents.txt; then
            echo "Generated source archive contains development or local test data"
            exit 1
          fi

      - name: Generate SHA-256 sidecars
        run: |
          set -euo pipefail
          shopt -s nullglob
          for asset in release-assets/*; do
            [[ -f "$asset" && "$asset" != *.sha256 ]] || continue
            hash=$(sha256sum "$asset" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$(basename "$asset")" > "${asset}.sha256"
          done
          package_count=$(find release-assets -maxdepth 1 -type f ! -name '*.sha256' | wc -l)
          checksum_count=$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)
          [[ "$package_count" -eq "$checksum_count" ]] || {
            echo "Every release package must have exactly one SHA-256 sidecar"
            exit 1
          }

      - name: Guard release assets
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.git|\.github|AGENTS\.md|VIBEDOCS|bugFix|featDocs|docs|resources|tests|scripts|TODO\.md|local-data|fixtures|samples|cache)(/|$)'
          shopt -s nullglob
          for asset in release-assets/*; do
            echo "Inspecting ${asset}"
            case "$asset" in
              *.sha256)
                package_asset="${asset%.sha256}"
                [[ -f "$package_asset" ]] || { echo "Orphan SHA-256 sidecar: ${asset}"; exit 1; }
                awk 'NF == 2 && $1 ~ /^[0-9A-Fa-f]{64}$/ { found=1 } END { exit found ? 0 : 1 }' "$asset" || {
                  echo "Invalid SHA-256 sidecar: ${asset}"
                  exit 1
                }
                continue
                ;;
              *.zip)
                zipinfo -1 "$asset" > asset-contents.txt
                ;;
              *.tar.gz)
                tar -tzf "$asset" > asset-contents.txt
                ;;
              *.AppImage)
                file "$asset" | grep -E 'ELF|AppImage'
                continue
                ;;
              *.exe|*.dmg)
                7z l -ba "$asset" > asset-contents.txt
                ;;
              *.msi)
                msiextract -l "$asset" > asset-contents.txt
                ;;
              *.deb)
                dpkg-deb -c "$asset" > asset-contents.txt
                ;;
              *.rpm)
                rpm -qlp "$asset" > asset-contents.txt
                ;;
              *.flatpak)
                bundle_repo="$(mktemp -d)"
                ostree init --repo="$bundle_repo" --mode=archive-z2
                flatpak build-import-bundle "$bundle_repo" "$asset" >/dev/null
                : > asset-contents.txt
                while IFS= read -r ref; do
                  ostree --repo="$bundle_repo" ls -R "$ref" /files >> asset-contents.txt
                done < <(ostree --repo="$bundle_repo" refs)
                rm -rf "$bundle_repo"
                ;;
              *)
                echo "Unsupported release asset: ${asset}"
                exit 1
                ;;
            esac
            if grep -E "$forbidden" asset-contents.txt; then
              echo "Release asset contains development or local test data: ${asset}"
              exit 1
            fi
          done

      - name: Write release notes
        run: |
          cat <<EOF > release-notes.md
          vibePlayerQT ${GITHUB_REF_NAME}

          Built from commit ${GITHUB_SHA}.

          Assets:
          - Windows x86_64 portable ZIP, NSIS installer (.exe), and MSI installer
          - macOS x86_64 ZIP and unsigned DMG
          - macOS arm64 ZIP and unsigned DMG
          - Linux x86_64 tar.gz, AppImage, DEB, RPM, and Flatpak bundle
          - Linux arm64 tar.gz, AppImage, DEB, RPM, and Flatpak bundle
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          edit_release_flags=(--prerelease=false)
          create_release_flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            edit_release_flags=(--prerelease --latest=false)
            create_release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "vibePlayerQT ${release_tag}" \
              --notes-file release-notes.md \
              "${edit_release_flags[@]}"
            gh release view "$release_tag" --json assets --jq '.assets[].name' |
              while IFS= read -r asset_name; do
                gh release delete-asset "$release_tag" "$asset_name" --yes
              done
            gh release upload "$release_tag" release-assets/*
          else
            gh release create "$release_tag" \
              release-assets/* \
              --title "vibePlayerQT ${release_tag}" \
              --notes-file release-notes.md \
              "${create_release_flags[@]}"
          fi
